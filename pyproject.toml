[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-triage"
version = "0.1.0"
description = "Surface error spikes and clustered stack traces in application logs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sraavan Chevireddy" }]
keywords = ["logs", "logging", "cli", "observability", "triage"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Logging",
]

[project.scripts]
log-triage = "logtriage.cli:main"

[project.urls]
Homepage = "https://github.com/SraavanChevireddy/log-triage"

[tool.setuptools.packages.find]
include = ["logtriage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
